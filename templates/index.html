
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .task-form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button, .action {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            color: white;
            background: #2563eb;
            cursor: pointer;
            text-decoration: none;
        }

        .task-list {
            list-style: none;
            padding: 0;
        }

        .task-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .task-name {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete {
            background: #dc2626;
        }

        .complete {
            background: #16a34a;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Task Manager</h1>

        <form class="task-form" action="/add" method="POST">
            <input
                type="text"
                name="task"
                placeholder="Enter a new task"
                required
                maxlength="200"
            >
            <button type="submit">Add</button>
        </form>

        <h3>My Tasks ({{ tasks|length }})</h3>

        {% if tasks %}
        <ul class="task-list">
            {% for task in tasks %}
            <li>
                <span class="task-name {% if task.completed %}completed{% endif %}">
                    {{ task.name }}
                </span>

                <a class="action complete"
                   href="{{ url_for('complete_task', task_id=task.id) }}">
                    {% if task.completed %}Undo{% else %}Done{% endif %}
                </a>

                <a class="action delete"
                   href="{{ url_for('delete_task', task_id=task.id) }}">
                    Delete
                </a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty">No tasks yet. Add your first task!</p>
        {% endif %}
    </div>
</body>
</html>
